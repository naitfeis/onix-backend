# ONIX — API + website shell on ONE Render web service (onix-api).
# Do NOT point www at a separate Render Static Site (onix-frontend): it has no /api,
# so Telegram login returns empty body → "Unexpected end of JSON input".
# www.onixtg.shop → onix-api custom domain (SPA+API same origin, __Host- cookies).
#
# Critical: startCommand must be a single Node process (no npm wrapper, no migrate&&start).
# Free plan does not run preDeployCommand — build:web applies migrations when RENDER=true.
# preDeployCommand stays for paid plans that actually execute it.
services:
  - type: web
    name: onix-api
    runtime: node
    plan: free
    region: frankfurt
    # Frontend Vite needs devDependencies during build:spa.
    buildCommand: npm ci --include=dev && npm run build:web
    preDeployCommand: npx prisma migrate deploy
    startCommand: node dist/main.js
    healthCheckPath: /api/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENABLE_DEBUG_ENDPOINTS
        value: "false"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: COORDINATION_BACKEND
        value: redis
      # Secret Redis connection string; configure in Render, never commit it.
      - key: REDIS_URL
        sync: false
      - key: RENDER_REGION
        value: frankfurt
      - key: OTEL_SERVICE_NAME
        value: onix-api
      - key: LOG_LEVEL
        value: info
      - key: ALERTING_ENABLED
        value: "true"
      # Same-origin SPA: leave VITE_API_URL empty in Render (relative /api).
      - key: VITE_API_URL
        value: ""
      - key: VITE_WEBSITE_AUTH_MODE
        sync: false
      - key: VITE_WEBSITE_LOGIN_PROVIDER
        sync: false
      - key: VITE_TELEGRAM_BOT_USERNAME
        sync: false
      - key: OPS_METRICS_TOKEN
        sync: false
      - key: ALERT_WEBHOOK_URL
        sync: false
      - key: ERROR_WEBHOOK_URL
        sync: false
      - key: SENTRY_DSN
        sync: false

  - type: worker
    name: onix-worker
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/worker.main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: OTEL_SERVICE_NAME
        value: onix-worker
      - key: LOG_LEVEL
        value: info
      - key: ALERTING_ENABLED
        value: "true"
      - key: RENDER_REGION
        value: frankfurt
      - key: ALERT_WEBHOOK_URL
        sync: false
      - key: ERROR_WEBHOOK_URL
        sync: false
