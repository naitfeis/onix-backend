# ONIX API — Render Blueprint
# Critical: migrate runs in preDeploy (separate one-shot), NOT in startCommand.
# startCommand must be a single Node process (no npm wrapper, no migrate&&start).
services:
  - type: web
    name: onix-api
    runtime: node
    plan: starter
    region: frankfurt
    # --include=dev: NODE_ENV=production would otherwise omit destinies needed for tsc/prisma.
    buildCommand: npm ci --include=dev && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: node dist/main.js
    healthCheckPath: /api/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      # Prevent accidental multi-worker wrappers (Heroku-style) from forking Nest.
      - key: WEB_CONCURRENCY
        value: "1"
      # Exposed by GET /api/health/network (ops probe).
      - key: RENDER_REGION
        value: frankfurt
